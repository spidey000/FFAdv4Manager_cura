name: Audit published Pages navigation
on:
  push:
    paths:
      - 'tests/ui/pages_navigation_audit.py'
      - '.github/workflows/pages-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'playwright==1.56.0'
      - name: Walk the actual public menus on mobile and desktop
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || true)"
          if [ -z "$CHROME_BIN" ]; then python -m playwright install chromium; fi
          CHROME_BIN="$CHROME_BIN" python tests/ui/pages_navigation_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-navigation-audit
          path: /tmp/ad4-navigation
          retention-days: 14
