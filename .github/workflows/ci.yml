name: Verify MosaicSlicer server integration
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Python venv and Mosaic frontend
        env:
          AD4_SKIP_ENGINE_BUILD: '1'
        run: bash scripts/install.sh
      - name: Test CLI, API, GX and server slicer
        run: |
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest -q tests/ci tests/cli tests/server tests/integration tests/cura tests/ui
          node --check overlays/mosaic/public/ad4-studio.js
          node --check overlays/mosaic/public/ad4-v3.js
          node --check overlays/mosaic/public/ad4-manager.js
          node --check overlays/mosaic/src/gui/viewer/ad4-plate-layout.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-plate-operations.mjs
          node --check frontend/src/gui/viewer/model_viewer.mjs
          node --check overlays/mosaic/src/gui/viewer/renderer.mjs
          node --check overlays/mosaic/src/gui/viewer/parser.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-gcode-geometry.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-three-slicer/core/toolpath_shaders.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-three-slicer/core/toolpath_segments.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-three-slicer/scene/toolpath_mesh.mjs
          test -f frontend/dist/three-slicer-viewer-LICENSE.txt
          node --check overlays/mosaic/src/gui/viewer/ad4-gpu-seams.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-layer-stack.mjs
          node --check overlays/mosaic/src/gui/viewer/ad4-bevel-profile.mjs
          node --test tests/ui/gcode_parser_perf.test.mjs
          node --test tests/ui/gcode_bevel_profile.test.mjs
          node --test tests/ui/gcode_gpu_seams.test.mjs
          node --test tests/ui/print_time_format.test.mjs
          node --test tests/ui/plate_layout.test.mjs
      - name: Benchmark external real 3DBenchy G-code fixture
        run: |
          curl -fsSL --retry 2 --max-time 90 \
            'https://raw.githubusercontent.com/xyz-tools/gcode-preview/4f2b58faebe97ca15ee2c901b6c487b8ad34e3e7/demo/gcodes/3DBenchy.gcode' \
            -o /tmp/ad4-3dbenchy.gcode
          test -s /tmp/ad4-3dbenchy.gcode
          AD4_UPSTREAM_GCODE=/tmp/ad4-3dbenchy.gcode node --test --test-name-pattern='upstream 3DBenchy' tests/ui/gcode_parser_perf.test.mjs
      - name: Ensure no CuraEngine browser worker is shipped
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/js/app.mjs
          test ! -e frontend/dist/js/worker.js
          grep -q MosaicSlicer frontend/dist/index.html
          grep -q ad4-manager.js frontend/dist/index.html
          grep -q ad4-settings.css frontend/dist/index.html
          grep -q ad4-studio.js frontend/dist/index.html
          grep -q ad4-studio.css frontend/dist/index.html
          grep -q ad4-v3.js frontend/dist/index.html
          grep -q ad4-v3.css frontend/dist/index.html
          test -f frontend/dist/ad4-studio.js
          test -f frontend/dist/ad4-studio.css
          test -f frontend/dist/resources/cura_data.tar.gz
          grep -q 'api/slice' overlays/mosaic/src/gui/slicer.mjs
      - name: Check generated Mosaic UX and syntax
        run: |
          node --check overlays/mosaic/public/ad4-manager.js
          node --check overlays/mosaic/src/gui/ad4-settings.mjs
          node --check overlays/mosaic/src/gui/ad4-presets.mjs
          node --check overlays/mosaic/src/gui/ad4-setting-help.mjs
          test -f frontend/dist/settings-guide/index.json
          test -f frontend/dist/settings-guide/articles/resolution/layer_height.md
          test -f frontend/dist/settings-guide/articles/images/layer_height_0.1.png
          test -f frontend/dist/settings-guide/LICENSE.md
          grep -q ad4-settings.css frontend/dist/index.html
      - name: Browser test the actual GitHub Pages editor (mobile and desktop)
        run: |
          .venv/bin/python -m pip install 'playwright==1.56.0'
          mkdir -p /tmp/ad4-pages/FFAdv4Manager_cura
          cp -a frontend/dist/. /tmp/ad4-pages/FFAdv4Manager_cura/
          cp /tmp/ad4-3dbenchy.gcode /tmp/ad4-pages/FFAdv4Manager_cura/stress-3dbenchy.gcode
          .venv/bin/python - <<'PY'
          from pathlib import Path
          path=Path('/tmp/ad4-pages/FFAdv4Manager_cura/index.html')
          html=path.read_text()
          assert '</head>' in html
          path.write_text(html.replace('</head>','<script>window.__AD4_STATIC_PREVIEW__=true;</script></head>',1))
          PY
          python3 -m http.server 8123 --directory /tmp/ad4-pages >/tmp/ad4-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then .venv/bin/python -m playwright install chromium; fi
          CHROME_BIN="$CHROME_BIN" .venv/bin/python tests/ui/pages_browser_smoke.py
          CHROME_BIN="$CHROME_BIN" .venv/bin/python tests/ui/large_stl_browser.py
          CHROME_BIN="$CHROME_BIN" .venv/bin/python tests/ui/large_gcode_browser.py
          .venv/bin/python tests/ui/printer_manager_browser.py
          .venv/bin/python tests/ui/live_job_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ad4-pages-browser-screenshot
          path: /tmp/ad4-pages-*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Smoke test local web server
        run: |
          .venv/bin/ffadv4manager-cura >/tmp/mosaic.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          .venv/bin/python - <<'PY'
          import time,urllib.request,urllib.error
          base="http://127.0.0.1:8765"
          for _ in range(30):
              try:
                  page=urllib.request.urlopen(base+"/",timeout=2).read()
                  break
              except Exception: time.sleep(1)
          else: raise RuntimeError("Mosaic UI did not start")
          assert b"MosaicSlicer" in page
          assert b"api/printer" in urllib.request.urlopen(base+"/ad4-manager.js").read()
          try: urllib.request.urlopen(base+"/api/slice/engine")
          except urllib.error.HTTPError as e: assert e.code==503
          PY
