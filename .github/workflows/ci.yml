name: Verify MosaicSlicer server integration
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Python venv and Mosaic frontend
        env:
          AD4_SKIP_ENGINE_BUILD: '1'
        run: bash scripts/install.sh
      - name: Test CLI, API, GX and server slicer
        run: |
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest -q tests/cli tests/server tests/integration tests/cura
      - name: Ensure no CuraEngine browser worker is shipped
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/js/app.mjs
          test ! -e frontend/dist/js/worker.js
          grep -q MosaicSlicer frontend/dist/index.html
          grep -q ad4-manager.js frontend/dist/index.html
          grep -q 'api/slice' overlays/mosaic/src/gui/slicer.mjs
      - name: Check generated Mosaic UX and syntax
        run: |
          node --check overlays/mosaic/public/ad4-manager.js
          node --check overlays/mosaic/src/gui/ad4-settings.mjs
          node --check overlays/mosaic/src/gui/ad4-presets.mjs
          grep -q ad4-settings.css frontend/dist/index.html
      - name: Smoke test local web server
        run: |
          .venv/bin/ffadv4manager-cura >/tmp/mosaic.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          .venv/bin/python - <<'PY'
          import time,urllib.request,urllib.error
          base="http://127.0.0.1:8765"
          for _ in range(30):
              try:
                  page=urllib.request.urlopen(base+"/",timeout=2).read()
                  break
              except Exception: time.sleep(1)
          else: raise RuntimeError("Mosaic UI did not start")
          assert b"MosaicSlicer" in page
          assert b"api/printer" in urllib.request.urlopen(base+"/ad4-manager.js").read()
          try: urllib.request.urlopen(base+"/api/slice/engine")
          except urllib.error.HTTPError as e: assert e.code==503
          PY
