name: Deploy AD4 Studio preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build MosaicSlicer viewer with isolated dependencies (no native engine)
        env:
          AD4_SKIP_ENGINE_BUILD: '1'
        run: bash scripts/install.sh
      - name: Prepare static-only public preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("frontend/dist")
          index=root/"index.html"
          assert index.is_file()
          html=index.read_text()
          assert "ad4-studio.js" in html and "ad4-studio.css" in html
          assert (root/"js/app.mjs").is_file()
          assert (root/"ad4-manager.js").is_file()
          assert (root/"ad4-studio.js").is_file()
          assert (root/"ad4-studio.css").is_file()
          assert (root/"demo-cube-20mm.stl").is_file()
          assert (root/"resources/cura_data.tar.gz").is_file()
          assert not (root/"js/worker.js").exists(), "CuraEngine must not run in the browser"
          # The editor (model loading, orbiting and settings) remains interactive.
          # Backend-only Slice/Print/Upload are disabled by this explicit flag.
          assert "</head>" in html
          html=html.replace("</head>",
            '<script>window.__AD4_STATIC_PREVIEW__=true;</script></head>',1)
          assert "__AD4_STATIC_PREVIEW__=true" in html
          import os
          revision=os.environ["GITHUB_SHA"][:12]
          for asset in ("js/app.mjs","main.css","ad4.css","ad4-settings.css",
                        "ad4-studio.css","ad4-manager.js","ad4-studio.js"):
              html=html.replace('"' + asset + '"','"' + asset + '?v=' + revision + '"')
          index.write_text(html)
          (root/".nojekyll").touch()
          print("Public AD4 Studio preview ready; printer controls disabled; server CuraEngine not shipped")
          PY
      - name: Validate real model preview and settings in Chromium before publishing
        run: |
          .venv/bin/python -m pip install 'playwright==1.56.0'
          mkdir -p /tmp/ad4-pages/FFAdv4Manager_cura
          cp -a frontend/dist/. /tmp/ad4-pages/FFAdv4Manager_cura/
          python3 -m http.server 8123 --directory /tmp/ad4-pages >/tmp/ad4-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then .venv/bin/python -m playwright install chromium; fi
          CHROME_BIN="$CHROME_BIN" .venv/bin/python tests/ui/pages_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-failure-screenshot
          path: /tmp/ad4-pages-smoke.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published Pages HTML and mobile assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,time,urllib.request
          site=os.environ["PAGE_URL"].rstrip("/")+"/"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(site,timeout=15) as response:
                      html=response.read().decode("utf-8")
                  assert "__AD4_STATIC_PREVIEW__=true" in html
                  assert "ad4-studio.js" in html
                  for asset in ("ad4-studio.css","ad4-studio.js","demo-cube-20mm.stl","js/app.mjs","resources/cura_data.tar.gz"):
                      with urllib.request.urlopen(site+asset,timeout=30) as response:
                          assert response.status==200,asset
                  print("Verified live mobile AD4 Studio public preview",site)
                  break
              except (OSError,AssertionError) as err:
                  if attempt==11: raise
                  print("Waiting for live Pages asset propagation:",err)
                  time.sleep(5)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the actual published Pages in Chromium
        env:
          AD4_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python -m venv .preview-venv
          .preview-venv/bin/python -m pip install 'playwright==1.56.0'
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then .preview-venv/bin/python -m playwright install chromium; fi
          CHROME_BIN="$CHROME_BIN" .preview-venv/bin/python tests/ui/pages_browser_smoke.py

