name: Replace legacy browser slicer on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Show server-only notice
        run: |
          mkdir -p static
          cat > static/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>FFAdv4Manager Cura — Server only</title>
          <style>body{background:#131b17;color:#eaf2ed;font:16px system-ui;padding:8vw;max-width:650px;margin:auto}a{color:#97deb4}</style>
          <h1>FFAdv4Manager Cura</h1>
          <p>This project now runs MosaicSlicer with server-side CuraEngine.</p>
          <p>GitHub Pages cannot execute a slicer engine or connect to your printer.</p>
          <p><a href="https://github.com/spidey000/FFAdv4Manager_cura">Installation and code</a></p>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: static
      - uses: actions/deploy-pages@v4
